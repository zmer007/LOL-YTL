services:
  lol-editor:
    build: .
    image: lol-infographic-editor:latest
    container_name: lol-infographic-editor
    ports:
      - "8765:8765"
    volumes:
      # 使用命名卷持久化 assets (首次启动时用镜像内自带的图片资源初始化)
      - assets_data:/app/assets
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai

volumes:
  assets_data:
